<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Secuverse Technologies</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Contact Secuverse Technologies for professional services and solutions. Get in touch for a consultation or quote.">
    <meta name="keywords" content="contact us, business contact, professional services, New Delhi">
    <meta name="author" content="Secuverse Technologies">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Contact Secuverse Technologies">
    <meta property="og:description" content="Contact us for professional services and solutions. Get in touch today.">
    <meta property="og:url" content="https://www.secuverse.ai/contact.html">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.secuverse.ai/contact.html">

    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <nav>
        <a href="index.html" class="business-name">
            <img src="images/logo.png" alt="SecuVerse Technologies logo" width="50" height="50" style="margin: auto;">
            <img src="images/name.png" alt="SecuVerse Technologies logo" width="200" height="50">
        </a>
        <!-- Hamburger Menu Button -->
        <div class="hamburger" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- Navigation Links -->
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <section class="page-header">
        <h1>Contact Us</h1>
    </section>

    <section class="contact">
        <div class="contact-grid">
            <div class="contact-info">
                <h2>Contact Us</h2><br>
                <p>Have a question or need assistance? Reach out via the form or contact us directly—we’ll get back to you soon!</p>
                <div class="contact-details">
                    <div>
                        <h3>Email</h3>
                        <p>info@secuverse.ai</p>
                    </div>
                    <div>
                        <h3>Phone</h3>
                        <p>(+91) 92203-74783</p>
                    </div>
                </div>
            </div>
            
            <div class="contact-form">
                <form id="ContactForm">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" name="name" placeholder="Your Name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" name="email" placeholder="Your Email" required>
                    </div>
                    <div class="form-group">
                        <label for="organization">Organization</label>
                        <input type="text" name="organization" placeholder="Your Organization"required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
                    </div>
                    <button type="submit" class="cta-button" id="submitBtn">Send Message</button>
                </form>
                <script>
                    const form = document.getElementById('ContactForm');
                    const submitBtn = document.getElementById('submitBtn');
                    const scriptURL = 'https://script.google.com/macros/s/AKfycbzElI8QV1A68MOAcAZUq-0Ig4HTN0c1PBnJQHKDbIeULEkvOwgsIHM_2REUVJ8GwLJK/exec';
                    let isSubmitting = false;
            
                    function sanitizeInput(input) {
                        return input.replace(/[<>]/g, '');
                    }
            
                    form.addEventListener('submit', async e => {
                        e.preventDefault();
                        if (isSubmitting) return;
                        
                        isSubmitting = true;
                        submitBtn.disabled = true;
                        
                        const formData = new FormData(form);
                        for (let [key, value] of formData.entries()) {
                            formData.set(key, sanitizeInput(value));
                        }
            
                        try {
                            const response = await fetch(scriptURL, {
                                method: 'POST',
                                body: formData
                            });
                            
                            if (!response.ok) throw new Error('Network response was not ok');
                            alert('Success!');
                            form.reset();
                        } catch (error) {
                            console.error('Error:', error);
                            alert('Submission failed. Please try again.');
                        } finally {
                            isSubmitting = false;
                            submitBtn.disabled = false;
                        }
                    });
                </script>
            </div>
        </div>
    </section>

    <footer>
        <p>Copyright &copy; 2025 SecuVerse Technologies. All rights reserved.</p>
    </footer>

    <!-- JS -->
    <script src="main.js"></script> 

</body>
</html>
